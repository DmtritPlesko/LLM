spring:
  application:
    name: analyzer

  # ── База данных ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/analyzer_db}
    username: ${SPRING_DATASOURCE_USERNAME:analyzer_user}
    password: ${SPRING_DATASOURCE_PASSWORD:analyzer_pass}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Redis ──
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}

  # ── Spring Session ──
  session:
    store-type: redis

server:
  port: 8081

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.diplom.analyzer: DEBUG
    org.springframework.security: INFO